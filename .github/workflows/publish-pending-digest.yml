name: Publish pending digest

on:
  push:
    # main only: this workflow commits published data and PATCHes the
    # production Supabase row, so a pending file pushed to a feature branch
    # must never trigger it.
    branches: [main]
    paths:
      - 'pending-digests/*.json'
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch deploy-pages.yml after publishing (see last step).
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pull the latest dashboard actions immediately before publication. This
      # closes the race where a pending digest was generated from an older
      # briefing_state.json snapshot and would otherwise restore completed
      # tasks as carry-overs.
      - name: Refresh dashboard state from Supabase
        env:
          SUPABASE_URL: https://niqzkombzncxxihhulqq.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pcXprb21iem5jeHhpaGh1bHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTI5NTgsImV4cCI6MjA4OTI2ODk1OH0.9DMbwxPi4yBkXG034sakwh6tnxt-AUcKkt_MER71qcg
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request

          url = os.environ['SUPABASE_URL'] + '/rest/v1/app_state?id=eq.1&select=data'
          key = os.environ['SUPABASE_ANON_KEY']
          req = urllib.request.Request(
              url,
              headers={'apikey': key, 'Authorization': f'Bearer {key}'},
          )
          rows = json.load(urllib.request.urlopen(req, timeout=30))
          if not rows or not isinstance(rows[0].get('data'), dict):
              raise SystemExit('Supabase app_state id=1 is missing or invalid')

          remote = rows[0]['data']
          path = pathlib.Path('briefing_state.json')
          local = json.loads(path.read_text(encoding='utf-8'))
          if (remote.get('lastModified') or 0) <= (local.get('lastModified') or 0):
              print('Repository state is already current.')
              raise SystemExit(0)

          history = {
              r['id']: r for r in local.get('reminderHistory', [])
              if isinstance(r, dict) and r.get('id')
          }
          for reminder in remote.get('reminderHistory', []):
              if isinstance(reminder, dict) and reminder.get('id'):
                  history[reminder['id']] = reminder

          merged = dict(local)
          for field in ('completed', 'hidden', 'reactions', 'edits', 'assigneeOverrides'):
              if field in remote:
                  merged[field] = remote[field]
          merged['reminderHistory'] = list(history.values())
          merged['reminders'] = [
              r for r in remote.get('reminders', [])
              if isinstance(r, dict) and r.get('id') and r['id'] not in history
          ]
          merged['lastModified'] = remote.get('lastModified') or 0
          path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'Refreshed state at {merged["lastModified"]}.')
          PY

      # Validates the taskId contract, prepends new digests, applies the
      # payload state, and auto-consumes reminders shown in each digest's
      # Reminders section (so a payload missing `state` can no longer leave
      # consumed reminders sitting in the dashboard queue).
      - name: Publish pending digest files
        run: |
          python scripts/publish_pending_digests.py
          git status --short

      - name: Commit published digest
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digests.json briefing_state.json pending-digests || true
          git commit -m 'Publish pending daily digest'
          git push

      # Keep Supabase (app_state id=1) in lockstep with briefing_state.json.
      # The dashboard writes user actions to Supabase; if Supabase were left
      # holding pre-publish state, its newer lastModified would resurrect
      # reminders this digest just consumed. The key is Supabase's PUBLIC anon
      # key (already shipped in index.html), so it adds no exposure here.
      - name: Sync published state to Supabase
        if: success()
        env:
          SUPABASE_URL: https://niqzkombzncxxihhulqq.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pcXprb21iem5jeHhpaGh1bHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTI5NTgsImV4cCI6MjA4OTI2ODk1OH0.9DMbwxPi4yBkXG034sakwh6tnxt-AUcKkt_MER71qcg
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request

          state = json.loads(pathlib.Path('briefing_state.json').read_text(encoding='utf-8'))
          key = os.environ['SUPABASE_ANON_KEY']
          req = urllib.request.Request(
              os.environ['SUPABASE_URL'] + '/rest/v1/app_state?id=eq.1',
              data=json.dumps({'data': state}).encode(),
              method='PATCH',
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal',
              },
          )
          try:
              urllib.request.urlopen(req, timeout=30)
              print('Supabase updated to match published briefing_state.json.')
          except Exception as e:
              # Non-fatal: the scheduled sync workflow converges the stores.
              print(f'Supabase write-back failed (sync workflow will converge): {e}')
          PY

      # Deploy the site now. deploy-pages.yml deliberately ignores pushes that
      # only touch the data files (to avoid deploy bursts from the ~15-min sync
      # automation), so without this dispatch a freshly published digest would
      # wait for the next 2h scheduled deploy — which GitHub cron often delays
      # by another 1-2h. Digests publish ~2x/day, so this adds no burst risk;
      # the `pages` concurrency group serializes it against any scheduled run.
      - name: Deploy dashboard to Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
